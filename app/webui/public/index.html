<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tau web</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <span class="brand">τ <b>tau web</b></span>
      <span id="status-chip" class="chip">loading…</span>
      <span class="spacer"></span>
      <span id="home-chip" class="chip muted"></span>
    </header>

    <main>
      <section id="chat">
        <div id="messages">
          <div class="note">
            Type a natural-language intent. Tau proposes a plan, the safety review runs first —
            execution only happens after you press <b>Run plan</b>.
          </div>
        </div>
        <form id="intent-form">
          <input
            id="intent"
            type="text"
            autocomplete="off"
            placeholder="e.g. list ts files under src — 自然语言也可以"
          />
          <button type="submit" id="plan-btn">Plan</button>
        </form>
      </section>

      <aside>
        <nav>
          <button data-tab="skills" class="tab active">Skills</button>
          <button data-tab="history" class="tab">History</button>
        </nav>
        <div id="tab-skills" class="tab-page active"></div>
        <div id="tab-history" class="tab-page"></div>
      </aside>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
